<!DOCTYPE html>
<html>
<head>
  <title>My App</title>
  <link rel="stylesheet" href="./dist/css/style.min.css">
  <link rel="stylesheet" href="./node_modules/quill/dist/quill.snow.css">
</head>
<body>
  <div id="overlay"></div>
<div id="signUp-card" class="modal">
    <h2>signUp</h2>
    <input id="signUp-username" type="text" placeholder="Username">
    <input id="signUp-password" type="password" placeholder="Password">

    <div class="file-upload-wrapper">
        <input type="file" id="signUp-profile-picture" accept="image/*">
        <label for="signUp-profile-picture" class="file-upload-btn">Choose File</label>
        <span id="file-name-display">No file chosen</span>
    </div>

    <button id="submit-signUp" type="submit">signUp</button>
</div>
<div id="delete-note-card" class="modal">
    <h2>Delete Note</h2>
    <p>Are you sure you want to delete this note?</p>
      <div class="buttons-container">
        <button id="cancel-delete-note-btn" type="submit">Cancel</button>
        <button id="delete-note-btn" type="submit">Delete Note</button>
      </div>
</div>
<div id="login-card" class="modal">
    <h2>Login</h2>
    <input id="login-username" type="text" placeholder="Username">
    <input id="login-password" type="password" placeholder="Password">
    <button id="submit-login" type="submit">Login</button>
</div>
<div id="add-note-card" class="modal">
    <h2>New Note</h2>
    <div class="editor-wrapper">

      <div id="note-title">
      </div>
    </div>
    <div class="editor-wrapper">
        <div id="editor-container"></div>
    </div>

    <div class="card-footer">
      <div class="add-tag">
          <div class="tag-input-wrapper" style="position: relative; width: 100%;">
              <input type="text" placeholder="Add a tag...">
              <div id="tags-suggestion-dropdown" class="tags-dropdown-menu"></div>
          </div>
          <button id="add-tag-btn" type="button">Add Tag</button>
      </div>
    <div class="tags"></div>
    <div id="isPinned">
      <label for="pin-note">
        <div class="tg-container">
          <span class="pin-note-text" style="margin-right: 10px;">Pin Note</span>
          <label class="toggle">
            <input type="checkbox" id="pinNote">
            <span class="slider"></span>
          </label>
        </div>
      </label>
    </div>
    </div>
  <button id="save-note-btn" type="submit">Save Note</button>
</div>
<div id="global-request-blocker">
    <div class="blocker-status-box">
        <div class="spinner"></div>
        <span id="global-blocker-text">The app is loading something...</span>
    </div>
</div>

  <header>
    <div class="container">
      <!-- <div class="logo">
        <img src="assets/images/logo.png" id="websiteLogo" alt="logo">
      </div> -->
      <div class="website-title">
        <h1>my notes</h1>
      </div>
      <div class="search-bar modal">
                <div class="icon">
          <svg width="800px" height="800px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M14.9536 14.9458L21 21M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
        </div>
        <input type="search" placeholder="Search..." name="" id="">
      </div>
      <div class="user">
        <img src="assets/images/df_user.png" alt="user-image">
        <span class="username">user name</span>
      </div>
      
      <div class="settings-menu ">
        <div class="icon">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
        </div>
        <span class="setting-text-dropdown">Settings</span>
        <div class="settings-dropdown modal" id="settings-dropdown-modal">
          <ul>
            <li id="dark-mode">
              <span class="text">Dark Mode</span>
              <div class="tg-container">
                <label class="toggle">
                <input type="checkbox" id="darkModeToggle">
                <span class="slider"></span>
              </label>
              </div>
            </li>
            <li id="open-at-startup">
              <span class="text">Open at Startup</span>
              <div class="tg-container">
                <label class="toggle">
                <input type="checkbox" id="openAtStartupToggle">
                <span class="slider"></span>
              </label>

            </li>
            <li id="user-signUp-logout">

            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

    <div class="notes-content">
      
  </div>

  <div class="add-note-btn" id="addNoteBtn"> 
    <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 24 24" fill="none">
<path d="M12.75 9C12.75 8.58579 12.4142 8.25 12 8.25C11.5858 8.25 11.25 8.58579 11.25 9L11.25 11.25H9C8.58579 11.25 8.25 11.5858 8.25 12C8.25 12.4142 8.58579 12.75 9 12.75H11.25V15C11.25 15.4142 11.5858 15.75 12 15.75C12.4142 15.75 12.75 15.4142 12.75 15L12.75 12.75H15C15.4142 12.75 15.75 12.4142 15.75 12C15.75 11.5858 15.4142 11.25 15 11.25H12.75V9Z" fill="#1C274C"/>

</svg></span> 
    <div class="hover-text">
      Add Note
    </div>
</div>
  <div class="notification-container">
  </div>
  <script src="./assets/main.js" type="module"></script>
</body>
</html>
